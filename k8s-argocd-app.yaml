apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: changeguard
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sahilransing2004-netizen/changeguard.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
