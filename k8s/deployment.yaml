apiVersion: apps/v1
kind: Deployment
metadata:
  name: changeguard
  labels: {app: changeguard}
spec:
  replicas: 1
  selector:
    matchLabels: {app: changeguard}
  template:
    metadata:
      labels: {app: changeguard}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: changeguard
          image: changeguard:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: LLM_PROVIDER
              value: "none"
          readinessProbe:
            httpGet: {path: /health, port: 8000}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
