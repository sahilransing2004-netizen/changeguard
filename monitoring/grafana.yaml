apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-datasources, namespace: monitoring}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc:9090
        isDefault: true
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, namespace: monitoring}
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.1.0
          env:
            - {name: GF_SECURITY_ADMIN_PASSWORD, value: admin}
          ports: [{containerPort: 3000}]
          resources:
            requests: {cpu: 50m, memory: 150Mi}
            limits: {memory: 384Mi}
          volumeMounts:
            - {name: ds, mountPath: /etc/grafana/provisioning/datasources}
      volumes:
        - name: ds
          configMap: {name: grafana-datasources}
---
apiVersion: v1
kind: Service
metadata: {name: grafana, namespace: monitoring}
spec:
  selector: {app: grafana}
  ports: [{port: 3000, targetPort: 3000}]
